<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aster Dashboard - LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0a0e17;color:white;font-family:Inter, sans-serif}
  .card{cursor:pointer;transition:.2s;border:1px solid #1e293b}
  .card:hover{border-color:#22c55e;transform:translateY(-2px)}
  .card.active{border-color:#22c55e;background:#111827}
  .up{color:#22c55e}.down{color:#ef4444}
  .live-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
  @keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
</style>
</head>
<body class="p-4 md:p-6">

<!-- HEADER -->
<div class="flex justify-between items-center max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold">⚡ ASTER <span class="text-green-400">LIVE</span></h1>
  <div class="flex items-center gap-2 text-sm">
    <span class="live-dot"></span> <span id="status">Connecting...</span>
    <span id="clock" class="text-gray-400 ml-2"></span>
  </div>
</div>

<!-- SEARCH + FILTER -->
<div class="max-w-7xl mx-auto mt-4 flex gap-2">
  <input id="search" oninput="filterCoins()" placeholder="Search coin... BTC, ETH, ASTER" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none">
  <button onclick="setFilter('all')" class="bg-green-500 px-4 py-2 rounded-lg font-bold">All</button>
  <button onclick="setFilter('gainers')" class="bg-slate-800 px-4 py-2 rounded-lg">Gainers</button>
  <button onclick="setFilter('losers')" class="bg-slate-800 px-4 py-2 rounded-lg">Losers</button>
</div>

<!-- COINS GRID - CLICKABLE -->
<div id="grid" class="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-3 mt-4"></div>

<!-- DETAIL PANEL - CLICK PE KHULEGA -->
<div id="detail" class="max-w-7xl mx-auto mt-6 bg-slate-900 border border-slate-700 rounded-xl p-4 hidden">
  <div class="flex justify-between">
    <div>
      <h2 id="d-name" class="text-2xl font-bold">BTCUSDT</h2>
      <p id="d-price" class="text-3xl font-bold text-green-400 mt-1">$0</p>
      <p id="d-meta" class="text-gray-400 text-sm mt-1"></p>
    </div>
    <div class="flex gap-2 h-fit">
      <button onclick="changeTF('1m')" class="tf bg-slate-800 px-3 py-1 rounded">1m</button>
      <button onclick="changeTF('5m')" class="tf bg-slate-800 px-3 py-1 rounded">5m</button>
      <button onclick="changeTF('1h')" class="tf bg-green-600 px-3 py-1 rounded">1h</button>
      <button onclick="changeTF('1d')" class="tf bg-slate-800 px-3 py-1 rounded">1d</button>
    </div>
  </div>
  <!-- TradingView Chart - Real Data -->
  <div class="h-[380px] mt-4 rounded overflow-hidden bg-black">
    <div id="tv-chart" style="height:100%"></div>
  </div>
  <div class="grid grid-cols-4 gap-3 mt-4 text-center">
    <div class="bg-slate-800 p-3 rounded"><p class="text-gray-400 text-xs">24h High</p><p id="d-high" class="font-bold">-</p></div>
    <div class="bg-slate-800 p-3 rounded"><p class="text-gray-400 text-xs">24h Low</p><p id="d-low" class="font-bold">-</p></div>
    <div class="bg-slate-800 p-3 rounded"><p class="text-gray-400 text-xs">24h Volume</p><p id="d-vol" class="font-bold">-</p></div>
    <div class="bg-slate-800 p-3 rounded"><p class="text-gray-400 text-xs">Funding</p><p id="d-funding" class="font-bold text-yellow-400">-</p></div>
  </div>
</div>

<!-- LIVE TRADES -->
<div class="max-w-7xl mx-auto mt-6 bg-slate-900 border border-slate-700 rounded-xl p-4">
  <h3 class="font-bold">🔴 Live Trades - <span id="trade-symbol">BTCUSDT</span></h3>
  <div id="trades" class="mt-3 space-y-1 text-sm font-mono max-h-[250px] overflow-hidden"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let allCoins = {};
let selected = 'BTCUSDT';
let filter = 'all';
let tradeWs = null;

const SYMBOLS = ['BTCUSDT','ETHUSDT','ASTERUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT'];

// 1. REST - Pehli baar data lao
async function loadInitial(){
  try{
    const res = await fetch('https://fapi.asterdex.com/fapi/v1/ticker/24hr');
    const data = await res.json();
    data.forEach(c=>{
      if(SYMBOLS.includes(c.symbol)) allCoins[c.symbol]=c;
    });
    render();
    document.getElementById('status').innerText = 'LIVE • Updated ' + new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('status').innerText='API Error - Retry...'; }
}

// 2. WEBSOCKET - Har second realtime update
function connectWS(){
  const ws = new WebSocket('wss://fstream.asterdex.com/ws/!ticker@arr');
  ws.onopen = ()=> document.getElementById('status').innerText='LIVE';
  ws.onmessage = (e)=>{
    const arr = JSON.parse(e.data);
    arr.forEach(c=>{
      if(allCoins[c.s]){
        allCoins[c.s].lastPrice=c.c;
        allCoins[c.s].priceChangePercent=c.P;
        allCoins[c.s].volume=c.v;
        allCoins[c.s].highPrice=c.h;
        allCoins[c.s].lowPrice=c.l;
      }
    });
    render();
    updateDetail();
  };
  ws.onclose = ()=> setTimeout(connectWS, 2000);
}

// 3. RENDER CARDS - Clickable
function render(){
  let list = Object.values(allCoins);
  const q = document.getElementById('search').value.toUpperCase();
  if(q) list = list.filter(c=>c.symbol.includes(q));
  if(filter==='gainers') list=list.filter(c=>parseFloat(c.priceChangePercent)>=0);
  if(filter==='losers') list=list.filter(c=>parseFloat(c.priceChangePercent)<0);

  document.getElementById('grid').innerHTML = list.map(c=>{
    const chg = parseFloat(c.priceChangePercent);
    const cls = chg>=0?'up':'down';
    const arrow = chg>=0?'▲':'▼';
    return `<div onclick="selectCoin('${c.symbol}')" class="card ${selected===c.symbol?'active':''} bg-slate-900 rounded-xl p-4">
      <div class="flex justify-between"><span class="font-bold">${c.symbol.replace('USDT','')}/USDT</span><span class="${cls}">${arrow} ${chg.toFixed(2)}%</span></div>
      <div class="text-xl font-bold mt-2">$${Number(c.lastPrice).toLocaleString()}</div>
      <div class="text-gray-400 text-xs mt-1">Vol: ${(Number(c.quoteVolume)/1000000).toFixed(1)}M • High $${Number(c.highPrice).toLocaleString()}</div>
      <div class="text-green-400 text-xs mt-2">Click to view chart →</div>
    </div>`;
  }).join('');
}

// 4. CLICK PE DETAIL + CHART + TRADES
function selectCoin(sym){
  selected = sym;
  render();
  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('trade-symbol').innerText = sym;
  document.getElementById('detail').scrollIntoView({behavior:'smooth'});
  loadChart(sym, '60');
  connectTrades(sym);
  updateDetail();
}

function updateDetail(){
  const c = allCoins[selected]; if(!c) return;
  document.getElementById('d-name').innerText = selected;
  document.getElementById('d-price').innerText = '$' + Number(c.lastPrice).toLocaleString();
  document.getElementById('d-price').className = 'text-3xl font-bold mt-1 ' + (parseFloat(c.priceChangePercent)>=0?'text-green-400':'text-red-400');
  document.getElementById('d-meta').innerText = `24h Change: ${c.priceChangePercent}% | Open: $${Number(c.openPrice).toLocaleString()}`;
  document.getElementById('d-high').innerText = '$'+Number(c.highPrice).toLocaleString();
  document.getElementById('d-low').innerText = '$'+Number(c.lowPrice).toLocaleString();
  document.getElementById('d-vol').innerText = (Number(c.quoteVolume)/1000000).toFixed(1)+'M';
  loadFunding();
}

async function loadFunding(){
  try{
    const r = await fetch(`https://fapi.asterdex.com/fapi/v1/premiumIndex?symbol=${selected}`);
    const d = await r.json();
    document.getElementById('d-funding').innerText = (parseFloat(d.lastFundingRate)*100).toFixed(4)+'%';
  }catch(e){}
}

function loadChart(sym, interval){
  document.getElementById('tv-chart').innerHTML='';
  new TradingView.widget({
    "autosize": true, "symbol": "BINANCE:"+sym, "interval": interval,
    "timezone": "Asia/Kolkata", "theme": "dark", "style": "1",
    "locale": "en", "toolbar_bg": "#0a0e17", "enable_publishing": false,
    "hide_top_toolbar": false, "container_id": "tv-chart"
  });
}

function changeTF(tf){
  const map={'1m':'1','5m':'5','1h':'60','1d':'D'};
  loadChart(selected, map[tf]);
}

// 5. LIVE TRADES WEBSOCKET
function connectTrades(sym){
  if(tradeWs) tradeWs.close();
  tradeWs = new WebSocket(`wss://fstream.asterdex.com/ws/${sym.toLowerCase()}@aggTrade`);
  tradeWs.onmessage = (e)=>{
    const t = JSON.parse(e.data);
    const el = document.getElementById('trades');
    const color = t.m ? 'text-red-400' : 'text-green-400';
    const side = t.m ? 'SELL' : 'BUY';
    const div = document.createElement('div');
    div.innerHTML = `<span class="text-gray-400">${new Date(t.T).toLocaleTimeString()}</span> <span class="${color} font-bold">${side}</span> <span>$${Number(t.p).toLocaleString()}</span> <span class="text-gray-400">Qty: ${t.q}</span>`;
    el.prepend(div);
    while(el.children.length>15) el.removeChild(el.lastChild);
  };
}

function filterCoins(){ render(); }
function setFilter(f){ filter=f; render(); }

setInterval(()=>{ document.getElementById('clock').innerText = new Date().toLocaleTimeString(); },1000);

loadInitial();
connectWS();
selectCoin('BTCUSDT');
</script>
</body>
</html>
